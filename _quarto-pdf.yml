# PDF edition (Typst). Typst books need a Quarto version newer than 1.6.
# Render with: quarto render --profile pdf --to typst
format:
  typst:
    toc: true
    toc-depth: 2
    keep-typ: true
    csl: typst/apa.csl
    papersize: a4
    fontsize: 10.5pt
    font-paths: [typst/fonts]
    include-before-body: typst/r4pd-style.typ
    template-partials:
      - typst/partials/typst-show.typ
