project:
  type: book
  resources:
    - R4PDE.net.pdf
execute:
  cache: true
  freeze: auto
book:
  favicon: cover.png
  google-analytics: "G-5T7SZYQV79"
  title: "R4PDE.net"
  subtitle: "R for Plant Disease Epidemiology - Edition 2"
  author: "Emerson M. Del Ponte"
  date: 10/23/2023   # first published (edition 1)
  date-format: long
  image: cover.png
  publisher: "Emerson M. Del Ponte"
  license: "CC BY-NC"
  sidebar:
    search: true
    style: floating
    collapse-level: 1
    border: true
    tools:
      - icon: file-earmark-pdf
        text: "Download PDF"
        href: R4PDE.net.pdf
  repo-url: https://github.com/emdelponte/epidemiology-R
  cover-image: cover.png
  repo-actions: [edit, issue]
  sharing: [twitter, linkedin]
  page-footer: 
    border: false
    background: light
    left: | 
      R4PDE - R for Plant Disease Epidemiology is written by Emerson Del Ponte
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.
    
  chapters:
    - index.qmd
    - cite.qmd
    - author.qmd
    - acknowledgements.qmd
    - intro.qmd
    - part: "Epidemic data"
      chapters:
        - data-terminology.qmd
        - data-ordinal.qmd
        - data-actual-severity.qmd
        - data-accuracy.qmd
        - data-sads.qmd
        - data-training.qmd
        - data-remote-sensing.qmd
        
        
    - part: "Temporal analysis"
      chapters: 
        - temporal-dpc.qmd
        - temporal-models.qmd
        - temporal-fitting.qmd
        - temporal-compartmental.qmd
    - part: "Spatial analysis"
      chapters:
        - spatial-gradients.qmd
        - spatial-models.qmd
        - spatial-fitting.qmd
        - spatial-patterns.qmd
        - spatial-tests.qmd
    - part: "Epidemics and yield"
      chapters:
        - yieldloss-concepts.qmd
        - yieldloss-regression-models.qmd
    - part: "Disease prediction"
      chapters: 
        - prediction-warning-systems.qmd
        - prediction-disease-modeling.qmd
    - references.qmd


date-modified: last-modified
language:
  title-block-published: "First published"
  title-block-modified: "Last updated"

bibliography: references.bib
# csl: phytopathology.csl  # not used: this dependent style needs zotero.org online; Quarto default author-date style is used instead
prefer-html: true
format:
  html:
    toc: true
    toc-depth: 5
    grid:
      sidebar-width: 260px
      body-width: 1300px
      margin-width: 210px
      gutter-width: 1.5rem
    theme: 
      light: 
        - zephyr
        - r4pd.scss
        #- custom.scss

  typst:
    toc: true
    toc-depth: 2
    keep-typ: true
    csl: typst/apa.csl
    papersize: a4
    fontsize: 10.5pt
    font-paths: [typst/fonts]
    include-before-body: typst/r4pd-style.typ
    template-partials:
      - typst/partials/typst-show.typ
